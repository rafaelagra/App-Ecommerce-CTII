<!DOCTYPE html>
<!--declarei HTML5 e o idioma português Br -->
<html lang="pt-BR">
<head>
    <!-- usei UTF-8 para que acentos como "Eletrônicos" apareçam certo -->
    <meta charset="UTF-8">
    <!--usei o viewport porque, sem ele, o celular simula uma tela de desktop e encolhe tudo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja</title>

    <!--importei o CSS do Bootstrap pela CDN, no <head>-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>

<!--usei bg-light para deixar o fundo cinza claro e destacar o card branco. -->
<body class="bg-light">

    <!--repeti a mesma navbar do index.html. Numa MPA, cada página precisa ter
         a sua própria cópia do menu (a explicação detalhada está no index.html). -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Minha Loja</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="vestuario.html">Vestuário</a></li>
                    <li class="nav-item"><a class="nav-link" href="eletronicos.html">Eletrônicos</a></li>
                    <li class="nav-item"><a class="nav-link" href="contato.html">Contato</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- usei mt-5 para o conteúdo não ficar escondido atrás da navbar fixed-top-->
    <div class="container py-4 mt-5">

        <!-- coloquei um botão para voltar à página anterior. history.back() faz o mesmo
             que o botão voltar do navegador: se o usuário veio de "Eletrônicos", volta para lá. -->
        <button class="btn btn-secondary mb-3" onclick="history.back()">← Voltar</button>

        <!-- usei um card com sombra (shadow) e espaço interno (p-3) para destacar o produto. -->
        <div class="card shadow p-3">

            <!--usei o grid de 12 colunas dentro do card:
                 no celular, imagem e texto ficam empilhados
                 a partir do md (768px), a imagem ocupa 4 colunas e o texto 8 (4 + 8 = 12) -->
            <div class="row g-3">

                <div class="col-md-4 text-center">
                    <!--usei img-fluid para a imagem nunca passar da largura da coluna. -->
                    <img src="imagens/telefone.jpg" class="img-fluid" alt="Telefone">
                </div>

                <div class="col-md-8">
                    <!--usei h2 porque aqui o nome do produto é o título principal do conteúdo. -->
                    <h2>Telefone</h2>
                    <p><strong>Categoria:</strong> Eletrônicos</p>
                    <p><strong>Preço:</strong> R$ 850,00</p>
                    <p><strong>Descrição:</strong> Melhor preço, qualidade e garantia do Brasil.</p>
                    <p><strong>Avaliação:</strong> 3.0 ⭐ (124 avaliações)</p>
                </div>

            </div> <!-- fechei a row -->
        </div> <!--fechei o card -->
    </div> <!--fechei o container -->

    <!-- Eu carreguei o JS do Bootstrap no fim do <body>. Ele faz o menu hambúrguer funcionar. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
</body>
</html>
