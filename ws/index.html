<!DOCTYPE html> <!--declarei HTML5 ee o idioma  português BR-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"> <!--usei para que acentos como calça e eletrônicos apareçam certo-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--sem ele, o celular simula uma tela de desktop e encolhe tudo-->
    <title>Minha Loja - Web Services</title>

    <!--importei o CSS do bootstrap pela CdN, no <head>-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">

    <!-- Eu inclui a biblioteca Axios pela CDN. É ela que faz as requisições HTTP para a API e já converte a resposta para JSON -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="bg-light">

<!--agora a navbar existe uma vez só-->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container-fluid">
        <!-- usei onclick para chamar navegar() e mostrar a home ao clicar na marca.
        O cursor: pointer mostra a "mãozinha", indicando que é clicável-->
        <span class="navbar-brand" onclick="navegar('tela-home')" style="cursor: pointer;">Minha Loja</span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
           <span class="navbar-toggler-icon"></span> 
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <!--coloquei data-bs-toggle e data-bs-target no <ul> para o menu hambúrguer fechar sozinho depois que eu clico num item no celular-->
            <ul class="navbar-nav ms-auto" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <!--troquei os links <a href=" " por <button>, pois não vou mais abrir outro arquivo: o clique só vai trocar a tela visível-->
                <li class="nav-item"><button class="nav-link" onclick="navegar('tela-vestuario')">Vestuário</button></li>
                <li class="nav-item"><button class="nav-link" onclick="navegar('tela-eletronicos')">Eletrônicos</button></li>
                <li class="nav-item"><button class="nav-link" onclick="navegar('tela-contato')">Contato</button></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-4 mt-5">
    <h1 class="text-center mb-4">Loja SPA com Web Services</h1>

    <!--TELA HOME. Agora a vitrine começa VAZIA: quem coloca os cards aqui dentro é o JavaScript, com os produtos que vêm da API.
      O id "lista-produtos" é o endereço que o JavaScript usa para encontrar essa área-->
    <div id="tela-home" class="tela show">
        <div id="lista-produtos" class="row row-cols-1 row-cols-md-3 g-4">
        </div>
    </div><!--fechei a tela home-->

    <!--TELA VESTUÁRIO. Começa com "collapse" (escondida)-->
    <div id="tela-vestuario" class="tela collapse">
        <div class="row row-cols-1 row-cols-md-3 g-4">

            <div class="col">
                <div class="card h-100" style="cursor: pointer;" onclick="mostrarDetalhes('Camiseta', 'imagens/camiseta.jpg', 'Vestuário', '50,00', 'Uma camiseta básica de ótima qualidade para o uso casual no dia a dia.', 4.5, 1024)">
                    <img src="imagens/camiseta.jpg" class="card-img-top p-3" alt="Camiseta" style="height: 250px; object-fit: contain;">
                    <div class="card-body">
                        <h5 class="card-title">Camiseta</h5>
                        <p class="card-text">R$ 50,00</p>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card h-100" style="cursor: pointer;" onclick="mostrarDetalhes('Calça', 'imagens/calca.jpg', 'Vestuário', '300,00', 'Uma calça para jovem', 5.0, 7024)">
                    <img src="imagens/calca.jpg" class="card-img-top p-3" alt="Calça" style="height: 250px; object-fit: contain;">
                    <div class="card-body">
                        <h5 class="card-title">Calça</h5>
                        <p class="card-text">R$ 300,00</p>
                    </div>
                </div>
            </div>

        </div> <!--fechei a row de vestuário-->
    </div> <!--fechei a tela-vestuario-->

    <!--TELA ELETRÔNICOS (escondida)-->
    <div id="tela-eletronicos" class="tela collapse">
        <div class="row row-cols-1 row-cols-md-3 g-4">

            <div class="col">
                <div class="card h-100" style="cursor: pointer;" onclick="mostrarDetalhes('Telefone', 'imagens/telefone.jpg', 'Eletrônicos', '850,00', 'Melhor preço, qualidade e garantia do Brasil.', 3.0, 124)">
                    <img src="imagens/telefone.jpg" class="card-img-top p-3" alt="Telefone" style="height: 250px; object-fit: contain;">
                    <div class="card-body">
                        <h5 class="card-title">Telefone</h5>
                        <p class="card-text">R$ 850,00</p>
                    </div> 
                </div>
            </div>

            <div class="col">
                <div class="card h-100" style="cursor: pointer;" onclick="mostrarDetalhes('Teclado', 'imagens/teclado.jpg', 'Eletrônicos', '100,00', 'Teclado ABNT', 3.5, 622)">
                    <img src="imagens/teclado.jpg" class="card-img-top p-3" alt="Teclado" style="height: 250px; object-fit: contain;">
                    <div class="card-body">
                        <h5 class="card-title">Teclado</h5>
                        <p class="card-text">R$ 100,00</p>
                    </div>
                </div>
            </div>

        </div><!--fechei a row de eletrônicos-->
    </div><!--fechei a tela-eletronicos-->

    <!--TELA CONTATO (escondida)-->
    <div id="tela-contato" class="tela collapse">
        <div class="card shadow p-4">
            <h2>Fale Conosco</h2>
            <p><strong>Endereço:</strong> Av. Mauro Ramos, 950 - Centro, 88020-300</p>
            <p><strong>Cidade:</strong> Florianópolis - SC</p>
            <p><strong>Telefone:</strong> (48) 99999-0000</p>
            <p><strong>Email:</strong> contato@minhaloja.com</p>
            <!--chamei voltar(), que mostra de novo a tela onde o usuário estava-->
            <button class="btn btn-secondary mt-3" onclick="voltar()">← Voltar</button>
        </div>
    </div><!--fechei a tela-contato-->

        <!--TELA PRODUTO (escondida)-->
    <div id="tela-produto" class="tela collapse">
        <!--usei voltar() para retornar à tela de onde o usuário veio (home ou categoria)-->
        <button class="btn btn-secondary mb-3" onclick="voltar()">← Voltar</button>
        <!-- Esta área começa vazia: a função mostrarDetalhes() preenche com innerHTML-->
        <div id="detalhes-produto" class="card shadow p-3">
        </div>
    </div><!--fechei a tela-produto-->

</div> <!--fechei o container-->

<!--carreguei o JS do Bootstrap no fim do <body>. Ele faz o menu hambúrguer funcionar-->
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>

<!--carreguei meu script depois do Bootstrap e no fim do body, para que todas
     as telas já existam quando o JavaScript procurar por elas-->
<script src="script.js"></script>

</body>
</html>
